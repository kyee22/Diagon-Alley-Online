stages:
  - setup
  - test

# 安装 Python 和 pytest
setup_python:
  stage: setup
  script:
    - sudo apt-get update  # 更新包管理器索引
    - sudo apt-get install -y python3 python3-pip  # 安装 Python3 和 pip
    - python3 --version  # 验证 Python3 是否安装成功
    - pip3 --version  # 验证 pip 是否安装成功
    - pip3 install pytest  # 安装 pytest
  artifacts:
    paths:
      - .pytest_cache/  # 保存 pytest 缓存文件

# 运行 pytest 测试
pytest_parallel:
  stage: test
  dependencies:
    - setup_python  # 依赖 setup_python 阶段
  parallel:
    matrix:
      - TEST_FILE: ["test_lab1.py", "test_lab3.py", "test_lab4.py"]
  script:
    - python3 -m pytest $TEST_FILE  # 使用 Python3 运行测试
